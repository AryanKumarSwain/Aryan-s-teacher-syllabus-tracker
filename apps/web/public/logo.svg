<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="stNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B2545" />
      <stop offset="100%" stopColor="#07192F" />
    </linearGradient>
    <linearGradient id="stTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00A884" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00A884" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Outer Ring Left (Navy) -->
  <path
    d="M 60,10 A 50,50 0 0,0 60,110"
    fill="none"
    stroke="url(#stNavyGrad)"
    stroke-width="7.5"
    stroke-linecap="round"
  />

  <!-- Outer Ring Right (Teal) -->
  <path
    d="M 60,110 A 50,50 0 0,0 60,10"
    fill="none"
    stroke="url(#stTealGrad)"
    stroke-width="7.5"
    stroke-linecap="round"
  />

  <!-- Inner Concentric Ring Accent -->
  <circle
    cx="60"
    cy="60"
    r="43"
    fill="none"
    stroke="#E2E8F0"
    stroke-width="1.5"
    stroke-dasharray="2 4"
    opacity="0.6"
  />

  <!-- Notebook Back Layer / Perspective -->
  <path
    d="M 48,27 L 76,27 C 80,27 83,30 83,34 L 83,38"
    fill="none"
    stroke="#0B2545"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Spiral Notebook Body -->
  <rect
    x="41"
    y="31"
    width="40"
    height="58"
    rx="6"
    fill="#FFFFFF"
    stroke="#0B2545"
    stroke-width="3.8"
  />

  <!-- Spiral Binder Spine Line -->
  <line
    x1="46"
    y1="31"
    x2="46"
    y2="89"
    stroke="#0B2545"
    stroke-width="2"
  />

  <!-- Spiral Loops on Left Spine -->
  <path
    d="M 46,39 C 36,39 36,46 46,46"
    fill="none"
    stroke="#0B2545"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 46,51 C 36,51 36,58 46,58"
    fill="none"
    stroke="#0B2545"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 46,63 C 36,63 36,70 46,70"
    fill="none"
    stroke="#0B2545"
    stroke-width="3.5"
    stroke-linecap="round"
  />
  <path
    d="M 46,75 C 36,75 36,82 46,82"
    fill="none"
    stroke="#0B2545"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Syllabus Lines inside Notebook -->
  <line
    x1="52"
    y1="43"
    x2="73"
    y2="43"
    stroke="#0B2545"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <line
    x1="52"
    y1="51"
    x2="69"
    y2="51"
    stroke="#0B2545"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <line
    x1="52"
    y1="59"
    x2="63"
    y2="59"
    stroke="#0B2545"
    stroke-width="3.2"
    stroke-linecap="round"
  />

  <!-- Completion Checkmark Overlay -->
  <path
    d="M 50,68 L 62,80 L 89,47"
    fill="none"
    stroke="url(#stTealGrad)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#subtleGlow)"
  />
</svg>
